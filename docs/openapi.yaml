openapi: 3.1.0
info:
  title: SubGlance API
  version: v1
  description: |
    The HTTP API of SubGlance, a self-hosted uptime monitor.

    The web UI is a client of this API and has no private endpoints: anything
    the dashboard can do, a script can do (product principle 4).

    Authentication accepts either a browser session cookie or a bearer API
    token; both resolve to the same user with the same rights. Routes are
    grouped by what they require — `public`, `read` (any authenticated user,
    including viewers), `write` (editor or admin) and `admin`. Every operation
    records its level in the `x-subglance-access` extension, which is checked
    against the server's route table by an automated drift test.

    Timestamps are RFC 3339 / ISO 8601 in UTC. Errors always share one shape:
    a JSON object with a single `error` string.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: The SubGlance instance itself; the API is served from its own origin.
tags:
  - name: Health
    description: Liveness and readiness probes for orchestrators.
  - name: Setup
    description: First-run bootstrap of the initial administrator account.
  - name: Auth
    description: Sessions, the current user and password changes.
  - name: Monitors
    description: Monitor definitions and their current state.
  - name: Heartbeats
    description: Individual check results recorded for a monitor.
  - name: Uptime
    description: Availability statistics over time windows.
  - name: Incidents
    description: Confirmed and unconfirmed outages, and their acknowledgement.
  - name: Channels
    description: Notification targets and their assignment to monitors.
  - name: Stream
    description: The live Server-Sent Events feed.
  - name: Tokens
    description: API tokens for scripts and CI.
  - name: Users
    description: Account administration.
security:
  - sessionCookie: []
  - bearerToken: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      description: |
        Reports whether the SubGlance process itself is alive. Deliberately
        dependency-free: it answers even when the database is unhappy, because
        an orchestrator uses it to decide whether to restart the process.
        Dependency health lives in `/api/v1/ready` instead.

        This is an unversioned alias of `GET /api/v1/health`, kept because most
        orchestrators are configured to probe `/health` by convention.
      security: []
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      x-subglance-access: public
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getApiHealth
      summary: Liveness probe (versioned path)
      description: |
        Identical to `GET /health`. Answers 200 as long as the process is
        serving, regardless of the state of the database.
      security: []
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      x-subglance-access: public
  /api/v1/ready:
    get:
      tags: [Health]
      operationId: getReady
      summary: Readiness probe
      description: |
        Reports whether SubGlance can actually serve traffic, which unlike
        `/health` means pinging the database (with a 2 second timeout).

        The split matters operationally: `/health` answering 200 while `/ready`
        answers 503 tells an orchestrator "leave this process alone, but send
        it no traffic yet" — restarting it would not fix a database that is
        still coming up.
      security: []
      responses:
        '200':
          description: The database responded; the instance is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: ready
                database: up
        '503':
          description: |
            No database is configured, or the ping failed. The `error` field
            carries the underlying reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: unavailable
                database: down
                error: 'context deadline exceeded'
      x-subglance-access: public
  /api/v1/setup:
    get:
      tags: [Setup]
      operationId: getSetupStatus
      summary: Report whether first-run setup is still needed
      description: |
        Unauthenticated by necessity: the UI has to know which screen to show
        before anyone can log in. `setup_required` is true only while the
        instance has no users at all.
      security: []
      responses:
        '200':
          description: The current setup state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
        '500':
          description: The user count could not be determined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: public
    post:
      tags: [Setup]
      operationId: completeSetup
      summary: Create the first administrator
      description: |
        Creates the initial admin account and signs it in by setting the
        session cookie.

        There is no default password and no seeded account, so an instance
        exposed before setup has no credentials to guess. Once any user exists
        this endpoint is permanently closed and answers 409.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: |
            The administrator was created and a session cookie was issued via
            `Set-Cookie`.
          headers:
            Set-Cookie:
              description: The new session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: |
            Malformed or unknown-field JSON, an email address without an `@`,
            or a password that fails the strength rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Setup has already been completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: setup has already been completed
        '500':
          description: The account could not be created, or was created but sign-in failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: public
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange credentials for a session cookie
      description: |
        On success a session cookie is set and the authenticated user is
        returned.

        Failed attempts are rate limited on both the email address and the
        client IP — ten failures per fifteen minutes each. Email alone would
        let an attacker spray many addresses from one host; IP alone would let
        a botnet grind a single account. A successful login clears both
        counters. An unknown address and a wrong password take the same time
        and return the same message, so responses never reveal which accounts
        exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Signed in; a session cookie was issued.
          headers:
            Set-Cookie:
              description: The new session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The request body was not valid JSON, or carried unknown fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid email or password
        '429':
          description: |
            Too many failed attempts for this email address or IP within the
            last fifteen minutes.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                example: 900
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The session could not be created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: public
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      description: |
        Deletes the server-side session, if a session cookie was presented, and
        clears the cookie. Public rather than authenticated on purpose: logging
        out must succeed even when the session has already expired, so it is
        never possible to be stuck holding a stale cookie.
      security: []
      responses:
        '204':
          description: Signed out; the session cookie was cleared.
          headers:
            Set-Cookie:
              description: The expired session cookie.
              schema:
                type: string
      x-subglance-access: public
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Return the authenticated user
      description: |
        Resolves whichever credential was presented — session cookie or bearer
        token — to the account behind it, including its role. Clients use this
        to decide which actions to offer.
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-subglance-access: read
  /api/v1/auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the caller's own password
      description: |
        Requires the current password even though the caller is already
        authenticated: that is what stops an unattended browser from becoming a
        permanent account takeover.

        A successful change invalidates every other session for the account —
        the whole point of changing a password after a suspected compromise —
        and issues a fresh session cookie for the caller so they are not logged
        out of the tab they are using.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password was changed and all other sessions were revoked.
          headers:
            Set-Cookie:
              description: A freshly issued session cookie for the caller.
              schema:
                type: string
        '400':
          description: Malformed JSON, or the new password fails the strength rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated, or the supplied current password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: current password is incorrect
        '500':
          description: The password could not be stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: read
  /api/v1/monitors:
    get:
      tags: [Monitors]
      operationId: listMonitors
      summary: List all monitors with their current state
      description: |
        Each monitor is enriched with the result of its latest heartbeat, its
        open incident (if any) and its 24-hour uptime, so a dashboard can be
        drawn from a single request.

        `status` comes from the incident record rather than the last heartbeat:
        a single failed check is `pending` until the monitor's retry threshold
        is crossed. Deriving it from the heartbeat alone would put the
        dashboard and the notifications into disagreement.

        Pass `heartbeats` to have each monitor's recent check results embedded
        in the same response. Without it the beat bars would cost one
        `listHeartbeats` call per monitor, which at a few hundred monitors is a
        few hundred round trips per page load; with it the whole grid comes out
        of a single request.
      parameters:
        - name: heartbeats
          in: query
          required: false
          description: |
            How many recent heartbeats to embed per monitor, oldest first.
            Omit the parameter to leave the `heartbeats` field out altogether.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: Every monitor, in creation order.
          content:
            application/json:
              schema:
                type: object
                required: [monitors]
                properties:
                  monitors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Monitor'
        '400':
          description: A `heartbeats` value that is not an integer in 1–1000.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: heartbeats must be between 1 and 1000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The monitors could not be listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: read
    post:
      tags: [Monitors]
      operationId: createMonitor
      summary: Create a monitor
      description: |
        Unknown JSON fields are rejected rather than ignored. Silently dropping
        them is a trap: a client that sends `interval_seconds` instead of
        `interval_s` would get a 201, believe it configured a fast check and
        quietly receive the default instead.

        The target is validated against the check type at creation time, so a
        typo is an error while the user is still looking at the form rather
        than a monitor that fails forever.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMonitorRequest'
      responses:
        '201':
          description: The monitor was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '400':
          description: |
            Malformed or unknown-field JSON, a missing name/type/target, an
            out-of-range interval or timeout, a target that cannot work for the
            chosen type, or a rejection from the storage layer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'a ping monitor cannot use a port; use a tcp monitor instead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-subglance-access: write
  /api/v1/monitors/{id}:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Monitors]
      operationId: getMonitor
      summary: Fetch one monitor with its current state
      description: |
        Same enrichment as the list endpoint, for a single monitor.

        The response carries a weak `ETag` derived from the monitor's
        `updated_at`. Hand it back as `If-Match` on a PATCH to make that update
        conditional on nobody else having edited the monitor in the meantime.

        The tag is weak on purpose: `updated_at` identifies the monitor's
        stored configuration, not the exact bytes of this response, which also
        carry live status, latency and uptime and therefore change without any
        edit.
      responses:
        '200':
          description: The monitor.
          headers:
            ETag:
              $ref: '#/components/headers/MonitorETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The monitor could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: read
    patch:
      tags: [Monitors]
      operationId: patchMonitor
      summary: Partially update a monitor
      description: |
        Every field is optional, and "not sent" is distinguished from "sent as
        the zero value". That distinction is the whole point of PATCH: with
        plain values, `{"name":"x"}` would also read as `interval_s: 0` and
        `enabled: false`, so a rename would silently pause the monitor and
        reset its schedule.

        Validation runs against the merged monitor, not the request: changing
        only the type can invalidate a target that was never touched, and that
        combination is rejected just as firmly as a bad create.

        Unlike create, an explicit `0` for `interval_s`, `timeout_s` or
        `ssl_warn_days` is an error rather than "use the default" — the client
        asked for something impossible on a monitor that already works.

        Updating preserves heartbeats, uptime history and any open incident;
        correcting a typo in a URL should not erase the record of last week's
        outage.

        ## Optimistic concurrency

        Send the `ETag` you got from `GET /api/v1/monitors/{id}` back as
        `If-Match` and the update is refused with `412 Precondition Failed`
        when someone else edited the monitor in the meantime, instead of
        silently overwriting their change. The check is performed inside the
        UPDATE statement, so it holds even when both writes arrive at once.

        A successful PATCH returns the new `ETag`, so a client making a series
        of edits does not need to re-fetch between them.

        Without `If-Match` the endpoint keeps its original last-write-wins
        behaviour, so existing scripts are unaffected.

        `If-Match: *` requires only that the monitor exists.

        RFC 9110 specifies strong comparison for `If-Match`, under which a weak
        validator never matches. Because every tag this API issues is a weak
        version stamp, that rule would make the header useless here, so the
        opaque part is compared and a client that sends `"<stamp>"` without the
        `W/` prefix is accepted as well. The stamp still changes on every
        write, so a stale tag is still refused.

        A syntactically invalid `If-Match` is a `400`, not a silent
        unconditional write.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMonitorRequest'
      responses:
        '200':
          description: The updated monitor.
          headers:
            ETag:
              $ref: '#/components/headers/MonitorETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '400':
          description: |
            An invalid id, a malformed `If-Match` header, malformed or
            unknown-field JSON, an empty name or target, an out-of-range value,
            an unknown type, HTTP method or keyword mode, or a rejection from
            the storage layer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No such monitor — either at read time, or because it was deleted
            between the read and the write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: |
            An `If-Match` was sent and the monitor no longer has that version:
            someone else edited it first, or it was deleted underneath the
            request. Nothing was written. Fetch the monitor again, decide
            whether your change still applies to what is now there, and retry
            with the fresh `ETag`.

            No `ETag` accompanies this response, deliberately: a client that
            could blindly retry with a handed-back validator would perform
            exactly the overwrite this status refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: >-
                  monitor 1 was modified by someone else; fetch it again and
                  reapply your change
        '500':
          description: The monitor could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: write
    delete:
      tags: [Monitors]
      operationId: deleteMonitor
      summary: Delete a monitor
      description: |
        Removes the monitor and, by cascade, its heartbeats, incidents and
        channel assignments. The manual-check cooldown for the id is forgotten
        so the in-memory table cannot grow without bound.

        Deleting an id that does not exist is not an error: the endpoint is
        idempotent.
      responses:
        '204':
          description: The monitor no longer exists.
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The monitor could not be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: write
  /api/v1/monitors/{id}/heartbeats:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Heartbeats]
      operationId: listHeartbeats
      summary: List a monitor's recent check results
      description: |
        Newest first. This backs the dashboard's beat bar, which is the single
        most frequent read in the product.

        The monitor's existence is confirmed first: an unknown id is a 404, not
        an empty list. "This monitor does not exist" and "this monitor has no
        heartbeats yet" are different facts and must not share one answer.
      parameters:
        - name: limit
          in: query
          required: false
          description: How many heartbeats to return.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: The requested heartbeats.
          content:
            application/json:
              schema:
                type: object
                required: [heartbeats]
                properties:
                  heartbeats:
                    type: array
                    items:
                      $ref: '#/components/schemas/Heartbeat'
        '400':
          description: An invalid monitor id, or a limit outside 1–1000.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: limit must be between 1 and 1000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The heartbeats could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: read
  /api/v1/monitors/{id}/uptime:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Uptime]
      operationId: getMonitorUptime
      summary: Availability statistics for a monitor
      description: |
        Without `window`, the three periods a dashboard almost always shows at
        once — 24h, 7d and 30d — are returned together, keeping the common case
        to a single round trip.

        `uptime` is null rather than 0 when the window contains no samples:
        "no data yet" and "0% up" are different facts, and collapsing them
        would make a brand new monitor look like a total outage.

        The monitor's existence is confirmed first, so a typo in a script gets
        a 404 instead of a tidy zero-sample answer that reads as "no data yet".
      parameters:
        - name: window
          in: query
          required: false
          description: |
            A single window instead of the three defaults. Go duration syntax
            plus a `d` suffix for whole days (`7d`); mixed forms such as
            `7d12h` are not accepted. Must be between 1m and 90d.
          schema:
            type: string
            examples: ['24h', '7d', '30m']
      responses:
        '200':
          description: One entry per requested window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UptimeResponse'
        '400':
          description: An invalid monitor id, or an unparseable/out-of-range window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: window must be between 1m and 90d
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The monitor could not be loaded or the uptime could not be computed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: read
  /api/v1/monitors/{id}/incidents:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Incidents]
      operationId: listMonitorIncidents
      summary: Incident history for one monitor
      description: |
        Returns both resolved and open incidents, newest first. The monitor's
        existence is confirmed first, so an unknown id is a 404 rather than an
        empty list that reads as "this monitor has never had an incident".
      parameters:
        - name: limit
          in: query
          required: false
          description: How many incidents to return.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: The incident history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentList'
        '400':
          description: An invalid monitor id, or a limit outside 1–500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The incidents could not be listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: read
  /api/v1/monitors/{id}/channels:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Channels]
      operationId: listMonitorChannels
      summary: List the channels a monitor alerts through
      description: |
        Secret config values are masked exactly as on the channel endpoints.
      responses:
        '200':
          description: The channels assigned to this monitor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelList'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The channels could not be listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: read
    put:
      tags: [Channels]
      operationId: setMonitorChannels
      summary: Replace a monitor's channel assignments
      description: |
        The supplied list becomes the complete set of channels for the monitor;
        anything not listed is unassigned. Sending an empty array detaches all
        of them. The updated set is returned, with secrets masked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMonitorChannelsRequest'
      responses:
        '200':
          description: The monitor's channels after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelList'
        '400':
          description: |
            An invalid monitor id, malformed or unknown-field JSON, or a
            channel id that does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The assignment could not be stored or read back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: write
  /api/v1/monitors/preview:
    post:
      tags: [Monitors]
      operationId: previewMonitorCheck
      summary: Probe a monitor that does not exist yet
      description: |
        Runs one check against a target without creating anything. Product
        principle 2 is sixty seconds from nothing to a working monitor, and
        what decides whether that holds is being able to tell the target is
        reachable **before** committing to it — otherwise the only way to
        discover a missing `https://` is to save, wait out the first scheduled
        check, and come back to edit.

        Nothing is written: no monitor, no heartbeat, no incident. The probe
        runs against an unsaved, disabled monitor, which is the same path a
        paused monitor takes.

        `type` may be omitted. A target with an `http`/`https` scheme, or a
        bare hostname, is read as an HTTP check (a bare hostname gains
        `https://`); a `host:port` is read as TCP. Anything the server cannot
        classify with confidence is a 400 rather than a guess. The response
        echoes the `type` and `target` that were really probed, so a form can
        show the user what it inferred.

        The check runs with the same defaults a saved monitor would get, so a
        passing preview is evidence about the monitor about to be created —
        except `retries`, which is always 1: retries decide when a failure
        becomes an incident, and a preview opens none.

        Rate limited to one preview per user per three seconds. There is no
        monitor id to key on, so this is the one authenticated way to ask the
        server to fetch an arbitrary address in a loop.

        A target that is down is a 200 with `ok: false`, not an error status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewCheckRequest'
      responses:
        '200':
          description: The check ran; `ok` says what it found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewCheckResult'
        '400':
          description: |
            Malformed, trailing or unknown-field JSON, a target that cannot be
            classified, a target shape that cannot work for its type, or a
            setting the save would reject — an unsupported `method`, an unknown
            `keyword_mode`, an out-of-range `timeout_s` or `ssl_warn_days`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: This user ran a preview within the last three seconds.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded up and never below 1.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The probe could not be run at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            This instance runs without a checker attached, so preview checks
            are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: write
  /api/v1/monitors/{id}/check:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    post:
      tags: [Monitors]
      operationId: checkMonitorNow
      summary: Run one check immediately
      description: |
        Exists because otherwise the only way to find out whether a fix worked
        is to wait out the interval, which for a fifteen-minute check makes the
        feedback loop useless precisely when someone is mid-incident.

        For an **enabled** monitor the result goes through the ordinary
        recording path — heartbeat, state engine, incident bookkeeping, live
        stream — so a monitor you have just fixed goes green now instead of at
        the next tick. It is a real observation of the target, so counting it
        toward uptime is honest.

        For a **paused** monitor nothing is recorded and `recorded` is false.
        A paused monitor is one the monitor promised not to watch; writing heartbeats
        into that gap would misrepresent an unmonitored period as a monitored
        one. The probe still runs and the result is still returned, because "is
        it back yet?" is exactly what someone asks before un-pausing.

        Rate limited to one manual check per monitor per five seconds, so a
        held-down button cannot turn one authenticated click into unbounded
        outbound traffic.

        A target that is down is a 200 with `ok: false`, not an error status.
      responses:
        '200':
          description: The check ran; `ok` says what it found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResult'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: A check for this monitor ran within the last five seconds.
          headers:
            Retry-After:
              description: Whole seconds to wait, rounded up and never below 1.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The monitor could not be loaded, or the probe could not be run at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            This instance runs without a checker attached, so manual checks are
            unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: write
  /api/v1/monitors/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    post:
      tags: [Monitors]
      operationId: pauseMonitor
      summary: Pause a monitor
      description: |
        Sets `enabled` to false. The monitor keeps its history but is no longer
        scheduled, and no heartbeats are recorded for the paused period.
        Returns the monitor in its new state.
      responses:
        '200':
          description: The paused monitor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The monitor could not be updated or reloaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: write
  /api/v1/monitors/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    post:
      tags: [Monitors]
      operationId: resumeMonitor
      summary: Resume a paused monitor
      description: |
        Sets `enabled` to true and puts the monitor back on the schedule.
        Returns the monitor in its new state.
      responses:
        '200':
          description: The resumed monitor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The monitor could not be updated or reloaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: write
  /api/v1/incidents:
    get:
      tags: [Incidents]
      operationId: listOpenIncidents
      summary: List every unresolved incident
      description: |
        Answers "what is broken right now" — the query the dashboard's landing
        view is built around. Includes incidents that have started but are not
        yet confirmed, so `confirmed` should be checked before treating one as
        a real outage.
      responses:
        '200':
          description: All open incidents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The incidents could not be listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: read
  /api/v1/incidents/{id}/ack:
    parameters:
      - name: id
        in: path
        required: true
        description: The incident's numeric id.
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 7
    post:
      tags: [Incidents]
      operationId: ackIncident
      summary: Acknowledge an incident
      description: |
        Acknowledging says "seen, working on it". It stops repeat
        notifications without claiming the problem is solved — the honest
        middle state between alerting and resolving. Resolution happens on its
        own when the monitor recovers.
      responses:
        '204':
          description: The incident is acknowledged.
        '400':
          description: The incident id was not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid incident id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such incident.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: incident not found
        '500':
          description: The acknowledgement could not be stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: write
  /api/v1/channels:
    get:
      tags: [Channels]
      operationId: listChannels
      summary: List notification channels
      description: |
        Secret-looking config values (`url`, `token`, `password`, `bot_token`)
        are masked as `****` plus the last four characters. A webhook URL is
        itself the credential for Slack and Discord, so returning it verbatim
        would let any viewer exfiltrate it. The tail is shown rather than the
        head because that is the part that differs between two Slack webhooks.
      responses:
        '200':
          description: Every channel, with secrets masked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The channels could not be listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: read
    post:
      tags: [Channels]
      operationId: createChannel
      summary: Create a notification channel
      description: |
        Each type has one config field it cannot work without: `url` for
        webhook, discord and slack; `bot_token` for telegram; `to` for email.
        Types are validated in Go rather than left to the database CHECK
        constraint, so an unknown type is a 400 and not a 500.

        A `url` target is fetched on the user's behalf, so its scheme and host
        are checked here as well as at delivery time: rejecting a bad scheme
        now turns a silently, permanently failing channel into an error at the
        moment the mistake is made.

        The response masks secrets, so the full value is only ever seen by the
        client that sent it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelRequest'
      responses:
        '201':
          description: The channel was created; secrets are masked in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          description: |
            Malformed or unknown-field JSON, a missing or over-long name, an
            unknown type, a missing required config key, a config value that is
            not a valid http/https URL, or over-long config keys or values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: config.url is required for a slack channel
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The channel could not be stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: write
  /api/v1/channels/{id}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Channels]
      operationId: getChannel
      summary: Fetch one notification channel
      description: Secret config values are masked; see `listChannels`.
      responses:
        '200':
          description: The channel, with secrets masked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ChannelNotFound'
        '500':
          description: The channel could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: read
    put:
      tags: [Channels]
      operationId: updateChannel
      summary: Replace a notification channel
      description: |
        A PUT rather than a PATCH: a channel is a small, self-contained
        document, and a partial config merge would leave no way to remove a
        key. Sending the whole object each time keeps deletion expressible.

        A client that read a channel and writes it back sends the *masked*
        secret, because that is all it ever saw. A secret value that still
        equals its own mask is therefore treated as "unchanged" and the stored
        credential is preserved — otherwise every round trip would silently
        destroy it.

        `enabled` is left as-is when the field is omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelRequest'
      responses:
        '200':
          description: The updated channel, with secrets masked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          description: An invalid id, malformed JSON, or a channel that fails validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ChannelNotFound'
        '500':
          description: The channel could not be loaded or stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: write
    delete:
      tags: [Channels]
      operationId: deleteChannel
      summary: Delete a notification channel
      description: |
        Also removes the channel from every monitor it was assigned to, by
        cascade. Unlike monitor deletion this is not idempotent: deleting an
        unknown id returns 404.
      responses:
        '204':
          description: The channel no longer exists.
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ChannelNotFound'
        '500':
          description: The channel could not be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: write
  /api/v1/stream:
    get:
      tags: [Stream]
      operationId: streamEvents
      summary: Live event stream (Server-Sent Events)
      description: |
        A long-lived `text/event-stream` connection carrying check results,
        status changes and incident transitions as they happen.

        SSE rather than WebSockets because the traffic is one-directional: the
        server tells the browser what happened and the browser never needs to
        answer on the same channel. SSE also reconnects on its own and survives
        proxies that mangle WebSocket upgrades.

        The stream sits behind the same authentication as everything else — an
        unguarded stream would leak every monitor name and outage to anyone who
        can reach the port — but it is a *read*: watching is all it does.

        Frame format:

        ```
        retry: 3000

        event: hello
        data: {"seq":42,"gap":false,"ping_interval_ms":20000,"server_time":"2026-01-01T12:00:00Z"}

        id: 43
        event: heartbeat
        data: {"kind":"heartbeat","monitor_id":1,"at":"...","data":{...},"seq":43}

        event: ping
        data: {"server_time":"2026-01-01T12:00:25Z"}
        ```

        - A `retry:` line is sent first, fixing the browser's reconnect delay
          at 3000 ms instead of leaving it to per-browser defaults.
        - A `hello` event then states the sequence number the stream starts at.
          A client reconnecting with a `Last-Event-ID` older than that is told
          `gap: true` and how many events it `missed`, so it knows to re-fetch
          rather than assume its view is current.
        - Each subsequent frame carries `id:` (the bus sequence number, usable
          as `Last-Event-ID`) and `event:` set to the event kind — `heartbeat`,
          `status` or `incident`.
        - A `lagged` event is emitted when this subscriber's buffer overflowed
          and events were dropped. Dropping is deliberate — a browser tab on a
          bad connection must never stall the scheduler — but it is never
          silent.
        - `ping` events every 20 seconds keep proxies (nginx defaults to a
          60 s idle timeout) from reaping the connection and let a client tell
          "nothing happened" apart from "this socket is dead". They are named
          events rather than `: ping` comment lines because a comment is
          dropped by `EventSource` before any listener runs, which leaves a
          browser unable to distinguish an idle stream from a dead one. A
          `ping` carries no `id:`, so it never moves a resume point. `hello`
          reports the interval as `ping_interval_ms` so a client can size its
          own silence watchdog from the server's configuration.
      parameters:
        - name: last_event_id
          in: query
          required: false
          description: |
            Resume point, as a fallback for clients that cannot set request
            headers on an `EventSource` — browsers cannot. The `Last-Event-ID`
            header takes precedence when present.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: Last-Event-ID
          in: header
          required: false
          description: The standard SSE resume header, sent automatically on reconnect.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The stream is open and will remain so until either side closes it.
          headers:
            Cache-Control:
              description: Always `no-cache, no-transform`.
              schema:
                type: string
            X-Accel-Buffering:
              description: Always `no`, to defeat nginx response buffering.
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
                description: A sequence of SSE frames; see the endpoint description.
              example: |
                retry: 3000

                event: hello
                data: {"seq":42,"gap":false,"ping_interval_ms":20000,"server_time":"2026-01-01T12:00:00Z"}

                id: 43
                event: heartbeat
                data: {"kind":"heartbeat","monitor_id":1,"at":"2026-01-01T12:00:05Z","seq":43}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: |
            The response writer does not support flushing, so events would sit
            in a buffer until a response that never ends.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: This instance runs without an event bus, so live updates are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: live updates are not available
      x-subglance-access: read
  /api/v1/tokens:
    get:
      tags: [Tokens]
      operationId: listTokens
      summary: List the caller's API tokens
      description: |
        Scoped to the authenticated user's own tokens. Only the prefix is
        returned; the token itself is stored as a hash and cannot be recovered.
      responses:
        '200':
          description: The caller's tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The tokens could not be listed.
