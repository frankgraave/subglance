      x-subglance-access: read
    post:
      tags: [Tokens]
      operationId: createToken
      summary: Issue a new API token
      description: |
        The plaintext token appears in this response and nowhere else, ever —
        only its hash is stored. The response therefore carries an explicit
        `warning`, because a user who misses the value and closes the tab must
        understand that the token is gone rather than assume it can be looked
        up later.

        A token inherits the role of the user who created it, so a viewer's
        token cannot write. Any authenticated user may mint tokens for
        themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: The token was created; store the plaintext now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTokenResponse'
        '400':
          description: |
            Malformed or unknown-field JSON, a missing or over-long name, or an
            `expires_in` that is unparseable or not positive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: expires_in must be a duration such as 720h
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The token could not be created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: read
  /api/v1/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The token's numeric id.
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 3
    delete:
      tags: [Tokens]
      operationId: revokeToken
      summary: Revoke an API token
      description: |
        Scoped to the caller's own tokens, so an id belonging to another
        account cannot be revoked by guessing the number — such an id is
        reported as 404, which also avoids confirming that it exists.
      responses:
        '204':
          description: The token is revoked and no longer authenticates.
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such token belonging to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: token not found
        '500':
          description: The token could not be revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-subglance-access: read
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
