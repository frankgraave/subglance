<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SubGlance</title>
    <!--
      The tab icon: the product mark, the up lamp on its tile, the same file
      the project site uses as its icon.

      Without a link the browser asks the root of the host for /favicon.ico
      by itself. At the root that answered the shell as text/html; under a
      path prefix (https://example.com/subglance/) it left the prefix, so the
      tab showed whatever else that host serves at /, or nothing. Written
      from the root like the font preloads below, so the build makes it
      relative and the server's depth rewrite keeps it under the prefix at
      every route. The tile is dark in both themes because it sits on the
      browser's own tab strip, which is light or dark independently of ours.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      The two faces the interface is set in, preloaded.

      They are declared with `font-display: block`, so the browser holds text
      back until they land rather than painting it twice. Discovering them only
      after the stylesheet has parsed would make that wait visible; preloading
      puts them in the first round trip, alongside the JavaScript. Same origin,
      so no `crossorigin` value other than anonymous would work for a font.
      Keep in step with src/styles/fonts.css — a renamed file here is a silent
      wasted download, not an error.
    -->
    <link
      rel="preload"
      href="/fonts/InterVariable-4.1-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/CommitMono-1.143-400-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Theme before first paint.

      React cannot do this: by the time it mounts, the browser has already
      painted one frame, and a light-mode user would see a black flash. This
      script runs synchronously in <head> and is deliberately dependency-free
      and duplicated logic — the alternative is a visible bug on every load.
      Keep it in step with src/theme/theme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("subglance:theme");
          var preference =
            stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var theme =
            preference === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : preference;
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* Keep the markup default. A wrong theme is survivable; a crash is not. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
