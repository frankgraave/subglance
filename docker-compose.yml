# SubGlance with Docker Compose.
#
#   docker compose up -d
#
# Then open http://localhost:8080/ and create the first administrator. That is
# the whole installation: the database is SQLite inside the named volume, so
# there is nothing to run alongside this service.
#
# There is no tagged release yet. `:edge` tracks the head of `develop` and will
# change under you; pin a version once v0.1 ships.

services:
  subglance:
    image: ghcr.io/frankgraave/subglance:edge
    container_name: subglance
    restart: unless-stopped
    ports:
      # host:container, bound to loopback on purpose. The first start has no
      # users yet, so whoever reaches the dashboard first becomes the
      # administrator; keeping it on 127.0.0.1 means that has to be someone on
      # this machine. Reach it from elsewhere over a reverse proxy or an SSH
      # tunnel, or drop the 127.0.0.1 prefix as a deliberate choice once an
      # administrator exists. The right-hand side is the image's own default
      # and changing it also means setting SUBGLANCE_ADDR below.
      - "127.0.0.1:8080:8080"
    volumes:
      # /data is the default --data-dir and holds subglance.db. The image
      # pre-creates it owned by the unprivileged user the process runs as.
      - subglance-data:/data
    environment:
      # Every option has a working default, so this block is optional. Flags
      # beat environment variables, which beat defaults.
      SUBGLANCE_LOG_LEVEL: info
      SUBGLANCE_LOG_FORMAT: text
      # SUBGLANCE_ADDR: ":8080"
      # SUBGLANCE_DATA_DIR: /data
      # SUBGLANCE_SHUTDOWN_TIMEOUT: 15s
      # SUBGLANCE_CHECK_WORKERS: "0"
      # How long raw heartbeats survive before being folded into hourly
      # buckets, and how long those buckets and resolved incidents survive
      # after that. Shorten the first on a small VPS; set the second to 0 to
      # keep summarised history forever.
      # SUBGLANCE_RAW_RETENTION: 168h
      # SUBGLANCE_ROLLUP_RETENTION: 8760h
      # Off by default on purpose: without the guard, a user-supplied URL turns
      # SubGlance into an SSRF proxy into whatever this container can reach.
      # Turn it on only if you mean to monitor services on your own network.
      # SUBGLANCE_ALLOW_PRIVATE_TARGETS: "false"
      # Behind a reverse proxy, name it here so the login rate limiter sees the
      # real client address instead of the proxy's. Empty means no forwarding
      # header is believed at all, which is the safe default: X-Forwarded-For
      # is set by whoever sends it, so trusting it from an unknown peer lets a
      # caller pick a fresh rate-limit bucket for every password guess.
      # Accepts addresses and CIDR blocks, comma-separated.
      # SUBGLANCE_TRUSTED_PROXIES: "172.16.0.0/12"
      # How long an alert waits for others before it is sent, so one outage
      # across many monitors becomes one message instead of one per monitor.
      # Set to 0 to deliver every alert immediately; that suits a handful of
      # services, where there is nothing to group and the wait is pure delay.
      # SUBGLANCE_ALERT_GROUP_WINDOW: 90s
      # SubGlance cannot report its own death: if this container is killed or
      # the host goes down, nothing turns red — the dashboard just stops
      # existing. Point this at a dead man's switch (Healthchecks.io, Dead
      # Man's Snitch, another SubGlance) and it will ping while it is still
      # completing checks. Monitor names, target URLs and check results never
      # leave here; the ping does carry how many monitors are scheduled and how
      # many checks have completed. Prefer an https URL, since over http those
      # counts travel in cleartext.
      # SUBGLANCE_WATCHDOG_URL: ""
      # SUBGLANCE_WATCHDOG_INTERVAL: 5m

    # ICMP ping checks need the container to allow unprivileged ICMP for the
    # process GID. Docker's own default already does; some Podman and
    # Kubernetes setups are stricter. Uncomment if a ping monitor reports a
    # permission error. HTTP, TCP and SSL checks are unaffected.
    # sysctls:
    #   net.ipv4.ping_group_range: "0 2147483647"

volumes:
  subglance-data:
