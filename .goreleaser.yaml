# How a `v*` tag becomes a downloadable release.
#
# GoReleaser rather than a hand-written matrix of `go build` steps, for one
# reason that matters and several that are merely convenient: the artefacts
# have to agree with each other. Five binaries, five archives, one checksum
# file that covers exactly those archives, and one signature over that
# checksum file. A hand-rolled workflow gets that right on the day it is
# written and drifts the first time somebody adds a platform. Here the
# platform list is three lines and everything downstream follows from it.
#
# Read together with .github/workflows/release.yml, which is deliberately
# thin: it prepares a tree (Node, then Go) and hands over.

version: 2

project_name: subglance

# The dashboard is compiled *into* the binary (see internal/webui), so the
# frontend build has to finish before the first Go build starts. Without
# these hooks the release would still succeed and every downloaded binary
# would answer / with the "no dashboard embedded" fallback — a working API
# and a useless release.
#
# `npm ci` and not `npm install`: a release must build the locked dependency
# tree, not whatever resolves that morning. It is repeated here rather than
# left to the workflow so that `goreleaser release --snapshot` reproduces the
# real thing on a laptop.
#
# Vite writes straight into internal/webui/dist, which .gitignore excludes
# apart from its .gitkeep. That is load-bearing: GoReleaser refuses to
# release from a dirty tree, so a dashboard build that left tracked changes
# behind would fail every release.
#
# Wrapped in `sh -c` because a hook is a plain command line, not a shell:
# GoReleaser splits it on whitespace and executes it directly, so `cd web &&
# …` would be passed to npm as arguments.
before:
  hooks:
    - sh -c "cd web && npm ci"
    - sh -c "cd web && npm run build"

builds:
  - id: subglance
    main: ./cmd/subglance
    binary: subglance

    # No cgo anywhere. The SQLite driver is modernc's pure-Go one precisely
    # so that cross-compiling needs no C toolchain, which is what lets all
    # five platforms build on one ubuntu-latest runner in a couple of
    # minutes. Setting this explicitly rather than relying on the default
    # means a future dependency that wants cgo fails here, loudly, instead
    # of silently producing a linux-only release.
    env:
      - CGO_ENABLED=0

    # The five platforms the ticket asks for, written as an explicit list
    # rather than goos × goarch: the cross product would also produce
    # windows/arm64 and darwin/amd64-on-nothing combinations nobody asked
    # for, and every extra archive is another thing to support.
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64

    flags:
      # Keeps absolute build paths out of the binary, so two people building
      # the same tag get the same bytes.
      - -trimpath

    # These three variables are the same ones the Makefile stamps. They are
    # not decoration: buildinfo.Version defaults to the string "dev", and a
    # released binary that reports "dev" in its startup log and in
    # /api/v1/health cannot be correlated with anything. {{.Version}} is the
    # tag without its leading v; buildinfo.Short() truncates the commit to
    # seven characters itself, so the full SHA is fine here.
    ldflags:
      - -s -w
      - -X github.com/frankgraave/subglance/internal/buildinfo.Version={{ .Version }}
      - -X github.com/frankgraave/subglance/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/frankgraave/subglance/internal/buildinfo.Date={{ .CommitDate }}

    # CommitDate above, not .Date: the wall-clock time of the build makes the
    # binary differ on every re-run of the same tag. mod_timestamp does the
    # same job for the file headers.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: subglance
    # `subglance_0.1.0_linux_amd64.tar.gz` — version before platform, so a
    # directory of downloads sorts by release rather than by operating
    # system.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      # Windows gets a zip because that is what Explorer opens without
      # installing anything.
      - goos: windows
        formats: [zip]
    # No CHANGELOG.md in here, and none in the repository: the notes are
    # generated per tag from the pull requests it contains (see `changelog`
    # below), so a checked-in file would be a second copy to keep in sync and
    # the one people read would be whichever was more wrong.
    files:
      - README.md
      - LICENSE

# One file, named the way the rest of the world names it, so that
# `sha256sum -c SHA256SUMS` works with no arguments after downloading it
# next to the archives.
checksum:
  name_template: SHA256SUMS
  algorithm: sha256

# Keyless signing with cosign: the signature is bound to this repository's
# GitHub Actions OIDC identity and recorded in the public Rekor log, so
# there is no private key for anyone to leak or for me to lose.
#
# Only the checksum file is signed, not each archive. SHA256SUMS already
# covers every artefact, so one signature over it authenticates all of them —
# five signatures would say nothing extra and cost five more Rekor entries.
#
# The output is a single Sigstore bundle (`SHA256SUMS.sigstore.json`) rather
# than a detached .sig plus .pem. That is not a style choice: cosign v3 —
# which is what sigstore/cosign-installer installs by default — deprecated
# `--output-signature` and `--output-certificate` and now *ignores* them,
# printing "will be ignored" and writing nothing. GoReleaser would then look
# for files that were never created. The bundle carries the signature, the
# certificate and the transparency-log proof in one file, and is the only
# supported shape going forward.
#
# Verifying a download:
#
#   cosign verify-blob SHA256SUMS \
#     --bundle SHA256SUMS.sigstore.json \
#     --certificate-identity-regexp 'https://github\.com/frankgraave/subglance/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   sha256sum -c SHA256SUMS --ignore-missing
signs:
  - id: cosign-checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    output: true
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

# The release notes.
#
# `github-native` asks GitHub to generate the notes, which means the list is
# built from the **pull requests** merged since the previous tag, by title.
#
# That is a deliberate departure from the ticket, which asked for a changelog
# derived from conventional commits. This repository does not use them for
# feature work: its history reads "Stop the screen saying \"Up\" after it
# stopped knowing" and "Make the honest-status section honest again". Only
# Dependabot writes `chore:` and `feat:` prefixes. A conventional-commit
# parser here would emit a changelog containing nothing but dependency bumps
# and would silently discard every human change — the exact inverse of a
# useful changelog.
#
# PR titles are the right source: every change lands as a squashed PR whose
# title is already a sentence written for a reader. Nothing has to be
# reformatted, and nothing has to be enforced on contributors.
#
# The cost of github-native is that GoReleaser's own grouping and filtering
# do not apply — the ordering and any categories come from
# .github/release.yml on GitHub's side. That is a fair trade for notes that
# contain the actual work.
changelog:
  use: github-native

release:
  draft: false
  # A tag containing a hyphen (v0.2.0-rc1) is marked pre-release
  # automatically, so a release candidate never becomes "latest" for someone
  # who clicked through from the README.
  prerelease: auto
  name_template: "v{{ .Version }}"
  footer: |
    ---

    **Verifying a download**

    ```sh
    sha256sum -c SHA256SUMS --ignore-missing
    ```

    The checksum file itself is signed with [cosign](https://docs.sigstore.dev/)
    using this repository's GitHub Actions identity — no private key involved:

    ```sh
    cosign verify-blob SHA256SUMS \
      --certificate SHA256SUMS.pem --signature SHA256SUMS.sig \
      --certificate-identity-regexp 'https://github\.com/frankgraave/subglance/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```

    Container images for the same tag are published separately to
    `ghcr.io/frankgraave/subglance`.

# Snapshot builds are how this configuration gets tested without pushing a
# tag (`make release-snapshot`). The suffix makes it obvious in a startup log
# that the binary did not come from a release.
snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"
