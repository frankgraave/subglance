# Publish the container image to GitHub Container Registry.
#
# Separate from ci.yml on purpose. CI answers "is this change sound" and must
# stay fast enough to gate every push; this workflow answers "can someone pull
# it", costs minutes because arm64 needs a second compile, and pushes to a
# registry. Mixing the two would slow every pull request down for an artefact
# nobody looks at until release.
#
# Triggers:
#   push to develop  -> tags `edge`, the current state of integration
#   tag v*           -> the version tags people pin
#   workflow_dispatch-> a build on demand, publishing nothing
#
# Pull requests build but never push: a fork must not be able to publish.
#
# A pushed image is then signed with keyless cosign by a second job, the only
# one that may ask GitHub for an OIDC token. See the `sign` job below.

name: Docker

on:
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push run publishes an image and then signs it in a second job;
  # cancelling it in between would leave that image unsigned. Only runs
  # that push nothing (pull requests, a manual build) are cancelled.
  cancel-in-progress: ${{ github.event_name != 'push' }}

# No `id-token` here on purpose: a workflow-level grant would reach every job,
# including the pull request build. Only the `sign` job asks for it.
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    outputs:
      # The digest of the manifest list that was pushed, for the sign job,
      # which reads it only on a push event.
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No QEMU: every stage that compiles runs on the native platform and
      # cross-compiles (Go does this for free, and the Node stage emits
      # platform-independent JavaScript). Emulating arm64 would make this
      # workflow several times slower for no difference in output.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # metadata-action overwrites any LABEL in the Dockerfile with its
          # own, so the description and licence have to be repeated here or
          # the published package shows an empty description.
          labels: |
            org.opencontainers.image.title=SubGlance
            org.opencontainers.image.description=Self-hosted uptime and API monitoring dashboard
            org.opencontainers.image.licenses=AGPL-3.0-only
          # `edge` for develop, semver for tags, plus a sha tag so a broken
          # release can be rolled back to an exact build.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=develop
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Only a real push publishes. On a pull request, and on a manual
          # dispatch, nothing is exported at all. `load: true` is not an
          # option here: the docker exporter cannot write a manifest list, so
          # asking for one on a two-platform build fails outright. The build
          # still runs for both architectures and still populates the cache,
          # which is the whole point of running it without publishing.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('edge-{0}', github.sha) }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The size is a claim on the landing page, so it is measured on every
      # build and the job fails if it regresses past the budget. 30MB is the
      # promise in SUB-35; the image measured 23.6MB when this landed, so
      # there is room for the binary to grow without silently breaking it.
      #
      # Measured uncompressed and on amd64 — that is the number `docker
      # images` shows, so it is the one people will check the claim against.
      - name: Measure and gate the image size
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          ref="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker pull --platform linux/amd64 "$ref" >/dev/null
          bytes=$(docker image inspect "$ref" --format '{{ .Size }}')
          # Gate on bytes, not on the rounded number: integer division would
          # let 30,999,999 bytes report as 30MB and slip past the budget.
          limit=30000000
          mb=$(( bytes / 1000000 ))
          echo "Uncompressed amd64 image: ${mb}MB (${bytes} bytes)"
          echo "### Image size: ${mb}MB (budget 30MB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt "$limit" ]; then
            echo "::error::image is ${bytes} bytes, over the ${limit} byte budget"
            exit 1
          fi

  # Keyless cosign, as the release archives are signed: the job exchanges a
  # GitHub OIDC token for a short-lived Sigstore certificate bound to this
  # workflow file and the ref it ran on, so no private key exists to leak and
  # anyone can verify the image against the public transparency log.
  # docs/installation.md shows the verification, pinned to this file.
  #
  # A separate job rather than a step in `publish`, so that `id-token: write`
  # exists only in a job that never runs for a pull request: the PR build
  # cannot mint a signing token even by accident.
  #
  # It signs the digest `publish` pushed, never a tag. A tag can be moved
  # between the push and the signature; the digest names the manifest list
  # for both architectures, so one signature covers every tag that points at
  # it (`edge`, `develop`, the sha tag, the version tags).
  #
  # `needs: publish` also means an image that failed the size gate is left
  # unsigned.
  sign:
    name: Sign the pushed image
    needs: publish
    if: github.event_name == 'push' && needs.publish.outputs.digest != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing the signature next to the image.
      packages: write
      # Exchanged for the Sigstore certificate.
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cosign 3 stores the signature as a Sigstore bundle attached to the
      # image as an OCI referrer, so verifying it needs cosign 3 or newer;
      # the install guide says so.
      - name: Sign the digest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
