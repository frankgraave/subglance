# Continuous integration.
#
# Three jobs, deliberately separated:
#
#   test   — the fast, hermetic suite that gates every push and PR
#   lint   — formatting, vet and golangci-lint
#   build  — proves the binary compiles for the platforms we ship
#
# Tests that need outbound network are excluded here via the `-short` flag
# (see TestMain in internal/checker). A CI runner's network is not the
# internet: DNS may be filtered, ICMP is usually blocked, and badssl.com
# going down must never turn this repository red. Those checks run in the
# separate `network` workflow on a schedule, where a failure means
# "investigate", not "your PR is broken".

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to a patch version rather than the "1.25" range. The range
  # resolves to whatever the runner has newest, which makes builds
  # irreproducible and, worse, makes the vulnerability scan's result depend
  # on the day it ran. Bump this deliberately.
  GO_VERSION: "1.26.8"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy — run 'go mod tidy' and commit the result"
            exit 1
          fi

      # The race detector is not optional here. This service runs checks from
      # a worker pool against shared state; a data race that only shows up
      # under load in production is exactly what it catches.
      - name: Test with race detector
        run: go test -race -short -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${total}%"
          echo "### Coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          # The state engine and incident store decide whether users get
          # woken up. Letting their coverage rot is not acceptable.
          #
          # This number is a few points below a local `make cover` run:
          # the network-dependent tests skip here, so the ICMP and dial
          # paths they cover go unmeasured. Compare like for like before
          # concluding coverage dropped.
          awk -v t="$total" 'BEGIN { if (t+0 < 65) { print "::error::coverage " t "% is below the 65% floor"; exit 1 } }'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # golangci-lint must be v2 (the config uses the v2 schema) AND built
      # with a Go at least as new as this module's `go` directive — it
      # refuses to run otherwise. Both are pinned rather than left on
      # "latest": the action's major version selects the linter's major
      # version, so `latest` silently resolved to a v1 build that could not
      # read the config at all.
      #
      # Bumping the `go` directive means checking that a golangci-lint
      # release built with that Go exists.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Pure Go, no cgo: cross-compiling has to stay this boring. The SQLite
      # driver is modernc's precisely so this step needs no C toolchain.
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w" -o /tmp/subglance ./cmd/subglance
          ls -lh /tmp/subglance

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # govulncheck reports only vulnerabilities on code paths actually
      # reachable from this binary, so a finding here is worth acting on
      # rather than triaging away.
      #
      # Pinned, for the same reason `latest` broke the lint job: the newest
      # release now requires a Go newer than this module targets, so an
      # unpinned install fails on a repository that has not changed. It also
      # keeps the scan reproducible — an unpinned scanner turns a green build
      # red without a commit.
      #
      # Most findings here are standard-library issues fixed in a Go patch
      # release, so GO_VERSION above is the real remedy: keep it current.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # The token guards are the reason this job exists. They read
      # docs/DESIGN.md off disk and fail if the stylesheet drifts from the
      # design document, or if any component grows a literal colour.
      - name: Test
        working-directory: web
        run: npm test

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck and build
        working-directory: web
        run: npm run build

      # The point of the build is that it ends up inside the Go binary. The
      # `build` job above proves the binary compiles without Node; this proves
      # the other half, that a binary built *with* the frontend actually
      # serves it. Without this, a broken embed path would stay green until
      # someone downloaded a release and found an empty page.
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Smoke test the embedded dashboard
        run: |
          go build -o /tmp/subglance ./cmd/subglance
          /tmp/subglance --addr 127.0.0.1:18099 --data-dir "$(mktemp -d)" &
          pid=$!
          trap 'kill $pid' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18099/api/v1/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18099/ | grep -q 'id="root"'
          # A client-side route must reach the shell, and an unknown API path
          # must stay JSON.
          curl -fsS http://127.0.0.1:18099/monitors/42 | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18099/api/v1/nope)" = 404
          curl -s http://127.0.0.1:18099/api/v1/nope | grep -q '"error"'
