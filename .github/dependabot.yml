# Dependency updates.
#
# govulncheck and `npm audit` tell me a dependency has a known problem; they do
# not fix it. This opens the pull request that does, so a vulnerable package
# does not sit in the tree until the next time someone looks.
#
# Weekly rather than daily, and grouped rather than one PR per package: every
# pull request in this repository is reviewed before it merges, and a flood of
# single-bump PRs would crowd out the work that moves the product.

version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # Patch and minor bumps are almost always routine, so they travel
      # together. Majors stay separate: those need reading.
      frontend-minor:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      go-minor:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    # The golang and node tags are the exact versions ci.yml tests and
    # release.yml ships, and this ecosystem cannot see those two files: left
    # alone it moved the image to a Go and a Node no CI job ran. A new Go
    # minor (1.27) or Node major (26) is a deliberate upgrade of all four
    # files, so it is not proposed here. A Go patch or a release in the same
    # Node line still is, because that is how a security fix arrives;
    # internal/buildinfo/toolchain_test.go keeps that PR red until the
    # workflows carry the same version.
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
